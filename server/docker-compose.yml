services:
  postgres:
    image: postgres:16
    container_name: scrumdone-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGOPTIONS: "-c tcp_keepalives_idle=30 -c tcp_keepalives_interval=10 -c tcp_keepalives_count=5"
    ports:
      - "5432:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - scrumdone-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 5

  scrumdone-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrumdone-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__LocalConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

      Frontend__BaseUrl: ${FRONTEND_URL}

      AdminCredentials__Password: ${INITIAL_ADMIN_PASSWORD}
      AdminCredentials__Email: ${INITIAL_ADMIN_EMAIL}
      AdminCredentials__Username: ${INITIAL_ADMIN_USERNAME}
      AdminCredentials__Name: ${INITIAL_ADMIN_NAME}
    ports:
      - "8080:8080"
    networks:
      - scrumdone-net

networks:
  scrumdone-net: